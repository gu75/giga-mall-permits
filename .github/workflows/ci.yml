name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, gd, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build CSS/JS
        run: |
          npm ci
          npm run build

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test